options {
        directory "/var/bind";

        // Configure the IPs to listen on here.
        listen-on { any; };
        
        recursion yes;
        allow-query { any; };
        dnssec-validation no;
};

// Config des zones (direct et reverse)

zone "ent.uwu" {
    type master;
    file "/etc/bind/db.ent.uwu";
    //masters {120.0.138.4;};
};


zone "136.0.120.in-addr-arpa" {
    type master;
    file "/etc/bind/db-rev.ent.uwu";
    //masters {120.0.138.4;};
};


