options {
        directory "/var/bind";

        // Configure the IPs to listen on here.
        listen-on { any; };
        
        recursion yes;
        allow-query { any; };
        dnssec-validation no;
};

// Config des zones (direct et reverse)
zone "uwu" {
    type master;
    file "/etc/bind/db.uwu";
};

zone "138.0.120.in-addr-arpa" {
    type master;
    file "/etc/bind/db-rev.uwu";
};



